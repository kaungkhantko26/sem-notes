<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">

  <!-- SEO -->
  <meta name="description" content="Read your unit notes in a calm Kindle-style reader — themes, font controls, progress memory and swipe navigation. Part of Note Lab: 2nd semester study notes.">
  <meta name="keywords" content="note lab, unit notes, AI recap, programming notes, database notes, networking notes, kindle style reading, study reader">
  <meta name="author" content="Kaung Khant Ko">
  <link rel="canonical" href="https://kaungkhantko26.github.io/sem-notes/reader.html">

  <!-- Social preview -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Note Lab">
  <meta property="og:title" content="Note Lab — Reader">
  <meta property="og:description" content="Kindle-style unit notes with themes, progress memory and keyword search.">
  <meta property="og:url" content="https://kaungkhantko26.github.io/sem-notes/reader.html">
  <meta property="og:image" content="https://kaungkhantko26.github.io/sem-notes/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=5">
  <link rel="apple-touch-icon" href="assets/favicon.svg?v=5">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<div class="reader">

  <div class="reader-topbar">
    <a href="index.html" class="icon-btn" aria-label="Back to library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="reader-title" id="readerTitle">…</div>
    <button class="icon-btn" id="tocBtn" aria-label="Table of contents">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <main class="reader-content" id="readerContent">
    <article class="page" id="page"></article>
  </main>

  <nav class="reader-menubar">
    <button class="menu-btn" id="typoBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2M9 20h6M12 5v15"/></svg>
      <span>Aa</span>
    </button>
    <div class="nav-arrows">
      <button class="icon-btn" id="prevBtn" aria-label="Previous unit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="icon-btn" id="nextBtn" aria-label="Next unit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div style="min-width:3.4rem;text-align:center;font-size:.78rem;color:var(--muted)" id="posLabel"></div>
  </nav>
</div>

<!-- TOC drawer -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle">Contents</h2>
    <div style="display:flex;gap:.3rem;align-items:center">
      <a class="icon-btn" href="index.html" aria-label="Back to library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      </a>
      <button class="icon-btn" id="drawerClose" aria-label="Close contents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <label class="drawer-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" id="tocSearch" placeholder="Search units…" autocomplete="off">
  </label>
  <div class="drawer-units" id="drawerUnits"></div>
</aside>

<!-- Typography sheet -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<section class="typo-sheet" id="typoSheet" aria-label="Reading settings">
  <div class="sheet-handle"></div>

  <div class="typo-row">
    <span class="typo-label">Size</span>
    <div class="font-ctrl">
      <button class="font-btn" id="fontMinus" aria-label="Smaller text">A&#8722;</button>
      <span class="font-preview" id="fontPreview">Aa</span>
      <button class="font-btn" id="fontPlus" aria-label="Larger text">A+</button>
    </div>
  </div>

  <div class="typo-row">
    <span class="typo-label">Theme</span>
    <div class="theme-dots">
      <button class="theme-dot dot-light" data-theme-val="light" aria-label="Light theme"></button>
      <button class="theme-dot dot-sepia" data-theme-val="sepia" aria-label="Sepia theme"></button>
      <button class="theme-dot dot-dark" data-theme-val="dark" aria-label="Dark theme"></button>
    </div>
  </div>

  <div class="typo-row">
    <span class="typo-label">Font</span>
    <div class="seg-group" id="fontFamilyGroup">
      <button class="seg-btn on" data-fontval="serif">Serif</button>
      <button class="seg-btn" data-fontval="sans">Sans</button>
    </div>
  </div>
</section>

<script src="js/modules.js?v=5"></script>
<script src="data/ai.js?v=5"></script>
<script src="data/programming.js?v=5"></script>
<script src="data/database.js?v=5"></script>
<script src="data/networking.js?v=5"></script>
<script src="js/md.js?v=5"></script>
<script src="js/reader.js?v=5"></script>
</body>
</html>
